baseURL: "https://topaiskills.com"
googleAnalytics: "G-V27BZ7GENQ"
theme: "terminal"
title: "Top AI Skills"
defaultContentLanguage: "en"

pagination:
  pagerSize: 8

markup:
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: daily
  filename: sitemap.xml
  priority: 0.8

outputFormats:
  SKILLSJSON:
    baseName: "index"
    isPlainText: true
    mediaType: "application/json"
    notAlternative: true

outputs:
  home:
    - HTML
    - JSON

params:
  contentTypeName: "tutorials"
  showMenuItems: 5
  fullWidthTheme: false
  centerTheme: true
  showLanguageSelector: true
  twitter:
    site: "@topaiskills"
    creator: "@topaiskills"

  logo:
    logoText: "Top AI Skills"
    logoHomeLink: "/"

