baseURL: "/"
locale: "en-us"
theme: "terminal"
title: "Top AI Skills"
defaultContentLanguage: "en"

pagination:
  pagerSize: 8

markup:
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  SKILLSJSON:
    baseName: "index"
    isPlainText: true
    mediaType: "application/json"
    notAlternative: true

outputs:
  home:
    - HTML
    - JSON

params:
  contentTypeName: "tutorials"
  showMenuItems: 5
  fullWidthTheme: false
  centerTheme: true
  showLanguageSelector: true

  logo:
    logoText: "Top AI Skills"
    logoHomeLink: "/"

languages:
