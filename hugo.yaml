        - identifier: "home"
          name: "Home"
          url: "/"
          weight: 10
        - identifier: "skills"
          name: "Skills"
          url: "/skills/"
          weight: 20
        - identifier: "tutorials"
          name: "Tutorials"
          url: "/tutorials/"
          weight: 30
        - identifier: "about"
          name: "About"
          url: "/about/"
          weight: 40

