# name: Keep HF Space Awake
# description: Ping Hugging Face Space every 20 minutes to prevent cold starts
# This file is intentionally kept minimal. DO NOT DELETE — needed to keep
# outman2025-n8n-scheduler.hf.space responsive.

name: Keep HF Space Awake

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: curl -s -o /dev/null -w "%{http_code}" https://outman2025-n8n-scheduler.hf.space
