name: Update GitHub Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.162.1"

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch GitHub stats
        run: scripts/fetch-github-stats.sh
        env:
          GITHUB_TOKEN: ${{ secrets.API_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit updated stats
        run: |
          if ! git diff --quiet -- content/skills/; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add content/skills/
            git commit -m "chore: update GitHub stats [skip ci]"
            git push
          fi
