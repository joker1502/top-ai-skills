{{ define "main" }}

  <p class="text-lg text-muted-foreground mb-8">{{ $.Site.Params.missingContentMessage | default "Page not found..." }}</p>
  <nav class="flex items-center justify-center gap-4">

    <a href="{{ "skills/" | absLangURL }}" class="px-4 py-2 border border-border/40 rounded-lg text-muted-foreground hover:border-primary/40 hover:text-primary transition-colors">Skills</a>
