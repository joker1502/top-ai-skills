<div class="relative" x-data="{ open: false }">
  <button @click="open = !open" aria-label="Select language" class="inline-flex items-center justify-center gap-1 whitespace-nowrap font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 px-2 text-xs rounded-xl opacity-60 hover:opacity-100">
    {{ .Language.Label }} <span class="text-[8px]">&#9660;</span>
  </button>
  <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 top-full mt-1 w-32 bg-popover border border-border/40 rounded-xl shadow-lg py-1 z-50">
    {{ range $.Site.Home.AllTranslations }}
      <a href="{{ .Permalink }}" class="block px-4 py-2 text-sm text-popover-foreground hover:bg-accent hover:text-accent-foreground{{ if eq .Language.Lang $.Site.Language.Lang }} font-semibold bg-accent{{ end }}">{{ .Language.Label }}</a>
    {{ end }}
  </div>
</div>
